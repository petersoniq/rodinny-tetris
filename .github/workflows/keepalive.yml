# (Kľúč je verejný "publishable"; funkcia ping() nič nevracia a nič neprepisuje.)
name: Udržiavanie databázy aktívnej

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
