    runs-on: ubuntu-latest
    steps:
      - name: Dotaz do databázy
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            "https://qfsedzymsjzlxuauyzro.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_bD9M4-8lhH7wlfLIMXQfVA_rgmduqKj" \
            -H "Content-Type: application/json" -d '{}'
          echo
